name: Python dependencies

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install build setuptools wheel
      - name: Check generated requirements
        run: python .github/scripts/update_requirements.py --check
      - name: Verify default and optional dependency installation
        run: python -m unittest discover -s .github/tests -v
